# Use --smoke to select reviewed open tasks and bounded budgets.
run:
  output_dir: ../../runs/suite/kernelbench_train
benchmark:
  name: kernelbench
  allow_sealed_test: false
  split: auto
  oracle_budget: 10
  dtype: fp32
  require_real_cuda: true
  # Set FLASHRSI_GPU_QUEUE, FLASHRSI_GPU_UUID, and worker auth at launch.
agent:
  name: program_search
  timeout: 12640
  request_timeout: 900
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    reasoning_effort: high
    thinking: {type: enabled}
algorithm:
  name: ace
  worker:
    type: llm
    request_timeout: 900
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking: {type: enabled}
  mode: online
  num_epochs: 1
  batch_size: 1
  max_reflection_rounds: 1
  val_repeats: 3
  eval_steps: 5

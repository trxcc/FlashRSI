# Use --smoke to select reviewed open tasks and bounded budgets.
run:
  output_dir: ../../runs/suite/frontier_eng_dev
benchmark:
  name: frontier_eng
  allow_sealed_test: false
  mode: real_tasks
  oracle_budget: 100
  # Real tasks require an explicit approved open manifest and stable run ID.
  # Set benchmark.frontier_manifest and benchmark.run_id at launch.
agent:
  name: program_search
  timeout: 213500
  request_timeout: 900
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    max_tokens: 32768
    reasoning_effort: high
    thinking: {type: enabled}
algorithm:
  name: sequential_memory
  worker:
    type: llm
    request_timeout: 900
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking: {type: enabled}

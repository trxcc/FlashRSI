# Use --smoke to select reviewed open tasks and bounded budgets.
run:
  output_dir: ../../runs/suite/clawgym_codex
benchmark:
  name: clawgym
  allow_sealed_test: false
  claw_solver_timeout: 660
  long_episode_timeout: 3000
  claw_judge_timeout: 180
  claw_max_turns: null
  harvey_max_turns: 200
  harvey_solver_timeout: 3600
  claw_checker_timeout: 120
  extractor_timeout: 120
  judge_timeout: 180
  judge_phase_timeout: 3600
  cpus: 2
  memory: 4g
  solver_pids: 192
  pids: 256
  shm_size: 256m
  train_judge_mode: batched
  val_judge_mode: per_criterion
  batch_size: 24
  judge_max_tokens: 16384
  judge_concurrency: 8
  judge_thinking: {type: enabled}
  judge_reasoning_effort: high
  val_judge:
    judge_model: gemini-3.5-flash
    judge_base_url: https://generativelanguage.googleapis.com/v1beta/openai
    judge_api_key_env: GEMINI_API_KEY
    judge_thinking: null
    judge_reasoning_effort: null
    judge_temperature: 0
agent:
  name: codex
  timeout: 660
  request_timeout: 900
  max_turns: null
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    reasoning_effort: high
    thinking: {type: enabled}
algorithm:
  name: ace
  worker:
    type: llm
    request_timeout: 900
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking: {type: enabled}
  mode: online
  num_epochs: 1
  batch_size: 4
  max_reflection_rounds: 1
  val_repeats: 0

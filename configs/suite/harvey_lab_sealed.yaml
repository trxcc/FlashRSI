# Sealed inventory. Runner refuses access before loading the manifest.
run:
  output_dir: ../../runs/suite/harvey_lab_sealed
benchmark:
  name: harvey_lab_sealed
  allow_sealed_test: false
  harvey_solver_timeout: 3600
  harvey_max_turns: 200
  val_judge_mode: per_criterion
agent:
  name: claude_code
  timeout: 3600
  request_timeout: 900
  max_turns: 200
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    reasoning_effort: high
    thinking:
      type: enabled
algorithm:
  name: ace
  worker:
    type: llm
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking:
          type: enabled
  mode: online
  max_reflection_rounds: 1

# Use --smoke to select reviewed open tasks and bounded budgets.
run:
  output_dir: ../../runs/suite/tb21_clean_codex
benchmark:
  name: tb21_clean
  allow_sealed_test: false
  smoke_whitelist_only: false
  smoke_task_ids: [cancel-async-tasks]
  n_attempts: 5
agent:
  name: codex
  request_timeout: 900
  max_turns: null
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    reasoning_effort: high
    thinking: {type: enabled}
algorithm:
  name: ace
  worker:
    type: llm
    request_timeout: 900
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking: {type: enabled}
  mode: online
  num_epochs: 1
  batch_size: 4
  max_reflection_rounds: 1
  val_repeats: 5

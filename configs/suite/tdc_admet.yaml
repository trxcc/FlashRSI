# Use --smoke to select reviewed open tasks and bounded budgets.
run:
  output_dir: ../../runs/suite/tdc_admet
benchmark:
  name: tdc_admet
  allow_sealed_test: false
  smoke_task_ids: [hia_hou]
  seeds: [1, 2, 3, 4, 5]
  oracle_budget: 20
  fit_timeout: 900
  predict_timeout: 120
  resources: {cpus: 4, memory: 8g, pids_limit: 256, shm_size: 512m}
agent:
  name: program_search
  timeout: 240120
  request_timeout: 900
  llm:
    model_name: deepseek-flash
    provider_name: deepseek
    base_url: https://api.deepseek.com/v1
    reasoning_effort: high
    thinking: {type: enabled}
algorithm:
  name: sequential_memory
  worker:
    type: llm
    request_timeout: 900
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com/v1
      reasoning_effort: high
      extra_body:
        thinking: {type: enabled}
